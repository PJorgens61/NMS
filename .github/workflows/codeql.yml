name: CodeQL

on:
  # Swift analysis takes ~20 minutes on a macOS runner, so skip it for
  # changes that cannot affect the result. Docs-only commits otherwise burn
  # two full runs: one for the PR, one for the push on merge.
  #
  # Deliberately not applied to gitleaks -- a credential pasted into a
  # README is entirely possible, so that workflow still scans everything.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    # No paths filter here: this is the safety net that catches anything
    # the filters above skipped.
    - cron: '27 6 * * 1'

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis requires a macOS runner with Xcode.
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # Built by target rather than scheme: this project has no shared
      # scheme in xcshareddata, so `-scheme NMS` is not resolvable in CI.
      - name: Build
        run: |
          xcodebuild build \
            -project NMS.xcodeproj \
            -target NMS \
            -configuration Debug \
            -destination 'platform=macOS' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
