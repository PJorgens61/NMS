name: CodeQL

on:
  # A run takes ~20 minutes, and measured on this project roughly 17 of
  # those are a cold, extractor-instrumented Xcode build -- the CodeQL
  # query evaluation itself is under a minute. So the only lever that
  # matters is running it less often.
  #
  # No push trigger: a squash merge onto linear history produces the same
  # tree the pull_request run already analyzed, so re-running on main
  # duplicates the full ~20 minutes for an identical result. The tradeoff
  # is that default-branch alerts in the Security tab come from the weekly
  # run rather than immediately on merge.
  #
  # paths-ignore: markdown cannot change Swift analysis results.
  # Deliberately not applied to gitleaks -- a credential pasted into a
  # README is entirely possible, so that workflow still scans everything.
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  schedule:
    # No paths filter here: this is the safety net that eventually analyzes
    # whatever the filter skipped, and runs newly published queries against
    # code that has not changed.
    - cron: '27 6 * * 1'

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis requires a macOS runner with Xcode.
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # Built by target rather than scheme: this project has no shared
      # scheme in xcshareddata, so `-scheme NMS` is not resolvable in CI.
      - name: Build
        run: |
          xcodebuild build \
            -project NMS.xcodeproj \
            -target NMS \
            -configuration Debug \
            -destination 'platform=macOS' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
