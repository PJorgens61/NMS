name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        # Full history: a secret that was committed and later removed is
        # still present in earlier commits, which a shallow clone misses.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
